name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and release verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check clean worktree
        run: npm run check:clean

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check domain contracts
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check maintainability budget
        run: npm run check:maintainability

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage ratchet
        run: npm run check:coverage-ratchet

      - name: Build app and bundle report
        run: npm run build:analyze

      - name: Enforce bundle performance budget
        run: npm run check:bundle

      - name: Check dependency licenses
        run: npm run check:licenses

      - name: Generate CycloneDX SBOM
        run: npm run generate:sbom

      - name: Create exact-SHA web verification manifest
        run: npm run release:evidence:web

      - name: Generate web artifact checksums
        run: npm run artifacts:checksums:web

      - name: Upload quality and release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-verification-${{ github.sha }}
          path: |
            coverage/coverage-summary.json
            dist/stats.html
            .artifacts/
          if-no-files-found: warn
          retention-days: 14

  source-artifact:
    name: Verify source artifact
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify clean source archive
        run: npm run pack:source

      - name: Generate source SBOM and license report
        run: |
          npm run check:licenses
          npm run generate:sbom

      - name: Create exact-SHA source verification manifest
        run: npm run release:evidence:source

      - name: Generate source artifact checksums
        run: npm run artifacts:checksums:source

      - name: Upload verified source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-artifact-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run performance budgets
        run: npm run test:perf
        env:
          PERF_RECORDS: "10000"
          VITE_RENDER_METRICS: "true"

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results-${{ github.sha }}
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Chromium and offline smoke tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Run production offline smoke test
        run: npm run test:e2e:offline

      - name: Create E2E verification manifest
        if: always()
        run: npm run release:evidence:e2e

      - name: Generate E2E artifact checksums
        if: always()
        run: npm run artifacts:checksums:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .artifacts/
          if-no-files-found: warn
          retention-days: 14

  cross-browser:
    name: Firefox and WebKit smoke tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Run cross-browser smoke tests
        run: npm run test:e2e:cross-browser

      - name: Upload cross-browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-browser-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android unit, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Run Android checks
        working-directory: android
        run: ./gradlew test lintDebug assembleDebug lintRelease assembleRelease
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0-ci.${{ github.run_number }}

      - name: Create Android verification manifest
        if: always()
        run: npm run release:evidence:android -- --allow-dirty

      - name: Generate Android artifact checksums
        if: always()
        run: npm run artifacts:checksums:android

      - name: Upload Android reports and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-results-${{ github.sha }}
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/tests/
            android/app/build/outputs/apk/
            android/app/build/outputs/bundle/
            .artifacts/
          if-no-files-found: warn
          retention-days: 14

  android-instrumentation:
    name: Android instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Android project
        run: npm run build && npm run cap:sync

      - name: Run app instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ github.sha }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
