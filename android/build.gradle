// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                details.useVersion '2.2.20'
                details.because 'Keep Kotlin stdlib variants aligned to avoid duplicate classes'
            }
        }
    }
}

// Capacitor plugin modules are compiled straight from node_modules, so their
// javac "uses unchecked or unsafe operations" / "uses a deprecated API" notes
// are noise we cannot act on. Suppress the notes there only — :app keeps them,
// so the same problems in our own sources stay visible.
subprojects { sub ->
    if (sub.name != 'app') {
        sub.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-XDsuppressNotes"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
