def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def configuredVersionCode = System.getenv("ANDROID_VERSION_CODE")
def configuredVersionName = System.getenv("ANDROID_VERSION_NAME")
// `releaseCheck` is excluded deliberately. It carries release's R8 setup so
// minification can be reproduced by hand, but it is never shipped, so demanding
// an explicit version code and name would only force callers to invent numbers
// for a build nobody distributes.
def requestedReleaseTask = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase()
    taskName.contains("release") && !taskName.contains("releasecheck")
}
def validVersionCode = configuredVersionCode != null &&
    configuredVersionCode ==~ /^[1-9]\d*$/ &&
    configuredVersionCode.toLong() <= 2100000000L
def validVersionName = configuredVersionName != null &&
    configuredVersionName ==~ /^[0-9A-Za-z][0-9A-Za-z._+\-]{0,99}$/
if (requestedReleaseTask && (!validVersionCode || !validVersionName)) {
    throw new GradleException(
        "Release tasks require valid ANDROID_VERSION_CODE and ANDROID_VERSION_NAME"
    )
}
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

apply plugin: 'com.android.application'

android {
    namespace = "com.leak.tracking"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.leak.tracking"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode validVersionCode ? configuredVersionCode.toInteger() : 1
        versionName validVersionName ? configuredVersionName : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v2 is what minSdk 24 needs and AGP enables on its own. v3 is
                // added for one reason: it is the only mechanism that can ever
                // replace this key without breaking updates. The app ships
                // outside the stores, so Play App Signing holds no copy of it
                // and losing it is otherwise final.
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        // An installable twin of release. `initWith` copies R8 and resource
        // shrinking, so this is the shipped code, but it is signed with the
        // debug key and therefore needs no release keystore — anyone, and CI,
        // can build it. It exists to make R8 damage reproducible by hand:
        // stripped plugin annotations crashed camera and geolocation on tap in
        // release only, and debug never goes through R8, so there was nothing
        // to install and try short of a signed release.
        //
        // The applicationId is suffixed on purpose. Without it this would share
        // `com.leak.tracking` with the real release while carrying a different
        // signature, and installing it over an installed release fails with
        // INSTALL_FAILED_UPDATE_INCOMPATIBLE. Suffixed, the two coexist.
        releaseCheck {
            initWith release
            applicationIdSuffix ".releasecheck"
            versionNameSuffix "-releasecheck"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
